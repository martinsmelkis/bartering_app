<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

    <!-- Face (soft oval, feminine) -->
    <ellipse cx="256" cy="285" rx="108" ry="115" fill="#ffd4a3" stroke="#1A1A1A" stroke-width="10" />

    <!-- Hair - Long flowing with center part -->
    <path d="M 256 140
          C 203 140, 163 158, 150 205
          L 150 260
          C 150 250, 153 240, 163 232
          C 173 224, 188 220, 205 222
          Q 230 210, 256 205
          Q 282 210, 307 222
          C 324 220, 339 224, 349 232
          C 359 240, 362 250, 362 260
          L 362 205
          C 349 158, 309 140, 256 140 Z" fill="#1A1A1A" />

    <!-- Long flowing sides -->
    <ellipse cx="160" cy="270" rx="22" ry="80" fill="#1A1A1A" />
    <ellipse cx="352" cy="270" rx="22" ry="80" fill="#1A1A1A" />

    <!-- Hair waves -->
    <path d="M 152 250 Q 158 260, 152 270" fill="none" stroke="#1A1A1A" stroke-width="4" />
    <path d="M 152 280 Q 158 290, 152 300" fill="none" stroke="#1A1A1A" stroke-width="4" />
    <path d="M 360 250 Q 354 260, 360 270" fill="none" stroke="#1A1A1A" stroke-width="4" />
    <path d="M 360 280 Q 354 290, 360 300" fill="none" stroke="#1A1A1A" stroke-width="4" />

    <!-- Center part -->
    <path d="M 256 205 L 256 225" fill="none" stroke="#1A1A1A" stroke-width="2" />

    <!-- Left eye (large, expressive) -->
    <circle cx="218" cy="275" r="13" fill="#1A1A1A" />
    <circle cx="222" cy="272" r="4.5" fill="#FFFFFF" opacity="0.95" />
    <circle cx="219" cy="278" r="2" fill="#FFFFFF" opacity="0.7" />

    <!-- Right eye (large, expressive) -->
    <circle cx="294" cy="275" r="13" fill="#1A1A1A" />
    <circle cx="298" cy="272" r="4.5" fill="#FFFFFF" opacity="0.95" />
    <circle cx="295" cy="278" r="2" fill="#FFFFFF" opacity="0.7" />

    <!-- Eyelashes (dramatic) -->
    <path d="M 208 271 Q 202 267, 205 263" fill="none" stroke="#1A1A1A" stroke-width="2.5" />
    <path d="M 228 271 Q 234 267, 231 263" fill="none" stroke="#1A1A1A" stroke-width="2.5" />
    <path d="M 284 271 Q 278 267, 281 263" fill="none" stroke="#1A1A1A" stroke-width="2.5" />
    <path d="M 304 271 Q 310 267, 307 263" fill="none" stroke="#1A1A1A" stroke-width="2.5" />

    <!-- Rosy cheeks -->
    <ellipse cx="196" cy="295" rx="17" ry="11" fill="#FFB6C1" opacity="0.4" />
    <ellipse cx="316" cy="295" rx="17" ry="11" fill="#FFB6C1" opacity="0.4" />

    <!-- Nose (petite) -->
    <circle cx="256" cy="305" r="5" fill="#1A1A1A" />

    <!-- Mouth (soft smile) -->
    <path d="M 228 340 Q 256 352, 284 340" fill="none" stroke="#1A1A1A" stroke-width="5"
        stroke-linecap="round" />
</svg>
