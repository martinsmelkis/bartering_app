<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

    <!-- Face (tall oval) -->
    <ellipse cx="256" cy="280" rx="115" ry="125" fill="#ffd4a3" stroke="#1A1A1A" stroke-width="12" />

    <!-- Hair - Curly afro style -->
    <circle cx="200" cy="170" r="35" fill="#1A1A1A" />
    <circle cx="230" cy="155" r="32" fill="#1A1A1A" />
    <circle cx="256" cy="145" r="35" fill="#1A1A1A" />
    <circle cx="282" cy="155" r="32" fill="#1A1A1A" />
    <circle cx="312" cy="170" r="35" fill="#1A1A1A" />
    <circle cx="175" cy="200" r="30" fill="#1A1A1A" />
    <circle cx="337" cy="200" r="30" fill="#1A1A1A" />
    <circle cx="160" cy="235" r="25" fill="#1A1A1A" />
    <circle cx="352" cy="235" r="25" fill="#1A1A1A" />

    <!-- Cover gaps in hair -->
    <path d="M 155 230
          C 155 190, 165 170, 200 155
          C 220 145, 240 140, 256 140
          C 272 140, 292 145, 312 155
          C 347 170, 357 190, 357 230
          L 357 250
          L 155 250 Z" fill="#1A1A1A" />

    <!-- Left eye (wide) -->
    <ellipse cx="215" cy="270" rx="16" ry="10" fill="#1A1A1A" />

    <!-- Right eye (wide) -->
    <ellipse cx="297" cy="270" rx="16" ry="10" fill="#1A1A1A" />

    <!-- Nose (wider bridge) -->
    <path d="M 248 300 L 245 320 L 267 320 L 264 300" fill="none" stroke="#1A1A1A" stroke-width="6"
        stroke-linecap="round" />

    <!-- Mouth (big smile with open) -->
    <path d="M 210 355 Q 256 375, 302 355 Q 256 365, 210 355 Z" fill="#1A1A1A" stroke="#1A1A1A"
        stroke-width="7" />
    <path d="M 210 355 Q 256 365, 302 355" fill="none" stroke="#FFFFFF" stroke-width="3" />
</svg>
