<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

    <!-- Face (rounder, slightly smaller) -->
    <circle cx="256" cy="275" r="110" fill="#ffd4a3" stroke="#1A1A1A" stroke-width="12" />

    <!-- Hair - Long wavy side part -->
    <path d="M 256 145
          C 190 145, 145 175, 145 225
          L 145 245
          C 145 235, 150 220, 165 210
          Q 180 200, 190 205
          Q 195 195, 205 190
          Q 220 185, 235 190
          Q 245 185, 256 185
          Q 297 198, 307 205
          Q 317 212, 327 222
          Q 337 232, 347 245
          L 347 225
          C 347 175, 322 145, 256 145 Z" fill="#1A1A1A" />

    <!-- Hair waves -->
    <path d="M 155 230 Q 165 225, 175 230 Q 185 235, 190 230" fill="none" stroke="#1A1A1A"
        stroke-width="3" />

    <!-- Left eye (round with highlight) -->
    <circle cx="220" cy="260" r="11" fill="#1A1A1A" />
    <circle cx="224" cy="257" r="3" fill="#FFFFFF" opacity="0.8" />

    <!-- Right eye (round with highlight) -->
    <circle cx="292" cy="260" r="11" fill="#1A1A1A" />
    <circle cx="296" cy="257" r="3" fill="#FFFFFF" opacity="0.8" />

    <!-- Nose (small button) -->
    <circle cx="256" cy="290" r="6" fill="#1A1A1A" />

    <!-- Mouth (gentle smile) -->
    <path d="M 225 325 Q 256 338, 287 325" fill="none" stroke="#1A1A1A" stroke-width="6"
        stroke-linecap="round" />
</svg>
