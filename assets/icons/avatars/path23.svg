<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

    <!-- Face (olive/tan skin tone) -->
    <ellipse cx="256" cy="280" rx="105" ry="115" fill="#ffd4a3" stroke="#1A1A1A" stroke-width="10" />

    <!-- Hair top/crown (moved 10% lower) -->
    <path d="M 136 217
          C 136 167, 180 130, 256 130
          C 332 130, 376 167, 376 217
          L 376 257
          C 376 257, 365 237, 345 227
          C 325 217, 295 212, 256 212
          C 217 212, 187 217, 167 227
          C 147 237, 136 257, 136 257
          Z" fill="#1A1A1A" />
    
    <!-- Hair sides (5% closer to face) -->
    <path d="M 154 225 Q 149 265, 154 315" fill="none" stroke="#1A1A1A" stroke-width="35" stroke-linecap="butt" />
    <path d="M 358 225 Q 363 265, 358 315" fill="none" stroke="#1A1A1A" stroke-width="35" stroke-linecap="butt" />

    <!-- Left eye (large, expressive with liner) -->
    <ellipse cx="220" cy="265" rx="11" ry="11" fill="#FFFFFF" />
    <circle cx="220" cy="267" r="9" fill="#2C1810" />
    <circle cx="222" cy="264" r="3" fill="#FFFFFF" />

    <!-- Eye liner -->
    <path d="M 205 258 Q 220 255, 235 258" fill="none" stroke="#1A1A1A" stroke-width="3"
        stroke-linecap="round" />

    <!-- Right eye (large, expressive with liner) -->
    <ellipse cx="292" cy="265" rx="11" ry="11" fill="#FFFFFF" />
    <circle cx="292" cy="267" r="9" fill="#2C1810" />
    <circle cx="294" cy="264" r="3" fill="#FFFFFF" />

    <!-- Eye liner -->
    <path d="M 277 258 Q 292 255, 307 258" fill="none" stroke="#1A1A1A" stroke-width="3"
        stroke-linecap="round" />

    <!-- Eyebrows -->
    <path d="M 200 250 Q 220 245, 238 250" fill="none" stroke="#2C1810" stroke-width="5"
        stroke-linecap="round" />
    <path d="M 274 250 Q 292 245, 312 250" fill="none" stroke="#2C1810" stroke-width="5"
        stroke-linecap="round" />

    <!-- Nose -->
    <circle cx="256" cy="300" r="6" fill="#a66d36" />

    <!-- Mouth (gentle smile) -->
    <path d="M 230 335 Q 256 347, 282 335" fill="none" stroke="#8B4513" stroke-width="6"
        stroke-linecap="round" />
</svg>
