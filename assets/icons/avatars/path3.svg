<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  
  
  <!-- Face (head circle with skin tone) -->
  <circle cx="256" cy="270" r="118" fill="#ffd4a3" stroke="#1A1A1A" stroke-width="12" />

    <!-- Hair/Head top (green semicircle) -->
    <path d="M 256 130
          C 180 130, 140 170, 140 230
          L 140 250
          C 140 250, 140 210, 180 190
          C 180 190, 200 170, 256 170
          C 312 170, 332 190, 332 190
          C 372 210, 372 250, 372 250
          L 372 230
          C 372 170, 332 130, 256 130 Z" fill="#1A1A1A" />

    <!-- Left eye -->
    <circle cx="210" cy="245" r="10" fill="#1A1A1A" />

    <!-- Right eye -->
    <circle cx="302" cy="245" r="10" fill="#1A1A1A" />
	
	<!-- Left eye (wide, expressive) -->
    <ellipse cx="210" cy="252" rx="12" ry="12" fill="#FFFFFF" />
    <circle cx="210" cy="252" r="10" fill="#3B2414" />
    <circle cx="212" cy="249" r="4" fill="#FFFFFF" />

    <!-- Right eye (wide, expressive) -->
    <ellipse cx="301" cy="252" rx="12" ry="12" fill="#FFFFFF" />
    <circle cx="300" cy="252" r="10" fill="#3B2414" />
    <circle cx="301" cy="249" r="4" fill="#FFFFFF" />

    <!-- Nose -->
    <circle cx="256" cy="297" r="6.5" fill="#1A1A1A" />

    <!-- Mouth (smile) -->
    <path d="M 220 333 Q 256 350, 292 333" fill="none" stroke="#1A1A1A"
        stroke-width="8" 
        stroke-linecap="round"/>
</svg>
