          L 147 225
          C 147 210, 152 195, 167 185
          C 182 175, 202 170, 222 172
          C 237 165, 246 163, 256 163
          C 266 163, 275 165, 290 172
          C 310 170, 330 175, 345 185
          C 360 195, 365 210, 365 225
          L 365 202
          C 350 160, 310 140, 256 140 Z" fill="#1A1A1A" />

    <!-- Headband -->
    <ellipse cx="256" cy="185" rx="110" ry="8" fill="#9370DB" stroke="#1A1A1A" stroke-width="2" />
    <circle cx="256" cy="185" r="8" fill="#FFD700" stroke="#1A1A1A" stroke-width="2" />

    <!-- Wavy sides -->
    <path d="M 150 225 Q 145 245, 148 265 Q 150 285, 155 305 Q 158 325, 165 345" fill="none" stroke="#1A1A1A" stroke-width="32" stroke-linecap="round" />
    <path d="M 155 240 Q 152 250, 154 265 Q 156 280, 160 295" fill="none" stroke="#1A1A1A"
