    <path d="M 362 225 Q 367 245, 364 265 Q 362 285, 357 305 Q 354 325, 347 345" fill="none" stroke="#1A1A1A" stroke-width="32" stroke-linecap="round" />
    <path d="M 357 240 Q 360 250, 358 265 Q 356 280, 352 295" fill="none" stroke="#1A1A1A"
        stroke-width="8" stroke-linecap="round" />

    <!-- Left eye (soft and friendly) -->
    <circle cx="224" cy="260" r="10" fill="#1A1A1A" />
    <circle cx="227" cy="257" r="3" fill="#FFFFFF" opacity="0.9" />

    <!-- Right eye (soft and friendly) -->
    <circle cx="288" cy="260" r="10" fill="#1A1A1A" />
    <circle cx="291" cy="257" r="3" fill="#FFFFFF" opacity="0.9" />

    <!-- Eyelashes -->
    <path d="M 217 256 Q 212 253, 215 252" fill="none" stroke="#1A1A1A" stroke-width="2" />
    <path d="M 231 256 Q 236 253, 233 252" fill="none" stroke="#1A1A1A" stroke-width="2" />
    <path d="M 281 256 Q 276 253, 279 252" fill="none" stroke="#1A1A1A" stroke-width="2" />
    <path d="M 295 256 Q 300 253, 297 252" fill="none" stroke="#1A1A1A" stroke-width="2" />

    <!-- Nose (small) -->
