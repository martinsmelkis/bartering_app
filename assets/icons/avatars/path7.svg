<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

    <!-- Face (oval with defined jawline) -->
    <ellipse cx="256" cy="280" rx="110" ry="125" fill="#ffd4a3" stroke="#1A1A1A" stroke-width="12" />

    <!-- Hair - Dreadlocks style -->
    <ellipse cx="180" cy="185" rx="18" ry="45" fill="#1A1A1A" />
    <ellipse cx="210" cy="170" rx="18" ry="50" fill="#1A1A1A" />
    <ellipse cx="240" cy="160" rx="18" ry="52" fill="#1A1A1A" />
    <ellipse cx="256" cy="155" rx="18" ry="55" fill="#1A1A1A" />
    <ellipse cx="272" cy="160" rx="18" ry="52" fill="#1A1A1A" />
    <ellipse cx="302" cy="170" rx="18" ry="50" fill="#1A1A1A" />
    <ellipse cx="332" cy="185" rx="18" ry="45" fill="#1A1A1A" />

    <!-- Hair base to cover gaps -->
    <path d="M 150 205
          C 150 175, 165 155, 190 145
          C 210 135, 235 130, 256 130
          C 277 130, 302 135, 322 145
          C 347 155, 362 175, 362 205
          L 362 225
          L 150 225 Z" fill="#1A1A1A" />

    <!-- Left eye (expressive) -->
    <circle cx="215" cy="270" r="13" fill="#1A1A1A" />
    <circle cx="219" cy="267" r="4" fill="#FFFFFF" opacity="0.8" />

    <!-- Right eye (expressive) -->
    <circle cx="297" cy="270" r="13" fill="#1A1A1A" />
    <circle cx="301" cy="267" r="4" fill="#FFFFFF" opacity="0.8" />

    <!-- Nose (wider) -->
    <path d="M 246 305 L 244 320 L 268 320 L 266 305" fill="none" stroke="#1A1A1A" stroke-width="7"
        stroke-linecap="round" />

    <!-- Mouth (friendly smile) -->
    <path d="M 220 350 Q 256 365, 292 350" fill="none" stroke="#1A1A1A" stroke-width="7"
        stroke-linecap="round" />
</svg>
