<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

    <!-- Face (round and soft) -->
    <circle cx="256" cy="280" r="108" fill="#ffd4a3" stroke="#1A1A1A" stroke-width="10" />

    <!-- Hair - High bun with hair accessories -->
    <path d="M 256 155
          C 205 155, 165 175, 150 215
          L 150 235
          C 150 220, 155 205, 170 195
          C 185 185, 205 180, 225 182
          C 238 175, 247 173, 256 175
          C 265 173, 274 175, 287 182
          C 307 180, 327 185, 342 195
          C 357 205, 362 220, 362 235
          L 362 215
          C 347 175, 307 155, 256 155 Z" fill="#1A1A1A" />

    <!-- High bun -->
    <ellipse cx="256" cy="145" rx="35" ry="38" fill="#1A1A1A" />
    <ellipse cx="256" cy="140" rx="30" ry="25" fill="#1A1A1A" />

    <!-- Hair accessory - bow -->
    <path d="M 220 145 Q 215 140, 220 135 Q 225 130, 230 135 L 235 140 L 230 145 Z" fill="#FF69B4"
        stroke="#1A1A1A" stroke-width="2" />
    <path d="M 292 145 Q 297 140, 292 135 Q 287 130, 282 135 L 277 140 L 282 145 Z" fill="#FF69B4"
        stroke="#1A1A1A" stroke-width="2" />
    <circle cx="256" cy="142" r="6" fill="#FF69B4" stroke="#1A1A1A" stroke-width="2" />

    <!-- Soft bangs -->
    <path d="M 190 195 Q 200 185, 210 200" fill="none" stroke="#1A1A1A" stroke-width="6"
        stroke-linecap="round" />
    <path d="M 220 188 Q 230 180, 240 195" fill="none" stroke="#1A1A1A" stroke-width="6"
        stroke-linecap="round" />
    <path d="M 272 195 Q 282 180, 292 188" fill="none" stroke="#1A1A1A" stroke-width="6"
        stroke-linecap="round" />
    <path d="M 302 200 Q 312 185, 322 195" fill="none" stroke="#1A1A1A" stroke-width="6"
        stroke-linecap="round" />

    <!-- Left eye (large, doe-eyed) -->
    <circle cx="222" cy="270" r="11" fill="#1A1A1A" />
    <circle cx="225" cy="267" r="3.5" fill="#FFFFFF" opacity="0.9" />

    <!-- Right eye (large, doe-eyed) -->
    <circle cx="290" cy="270" r="11" fill="#1A1A1A" />
    <circle cx="293" cy="267" r="3.5" fill="#FFFFFF" opacity="0.9" />

    <!-- Eyelashes -->
    <path d="M 215 267 Q 210 263, 213 260" fill="none" stroke="#1A1A1A" stroke-width="2" />
    <path d="M 229 267 Q 234 263, 231 260" fill="none" stroke="#1A1A1A" stroke-width="2" />
    <path d="M 283 267 Q 278 263, 281 260" fill="none" stroke="#1A1A1A" stroke-width="2" />
    <path d="M 297 267 Q 302 263, 299 260" fill="none" stroke="#1A1A1A" stroke-width="2" />

    <!-- Nose (petite button) -->
    <circle cx="256" cy="298" r="5" fill="#1A1A1A" />

    <!-- Mouth (small, sweet smile) -->
    <path d="M 232 330 Q 256 340, 280 330" fill="none" stroke="#1A1A1A" stroke-width="5"
        stroke-linecap="round" />
</svg>
