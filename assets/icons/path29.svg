<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

    <!-- Face (medium brown skin tone, strong features, 5% narrower) -->
    <path d="M 256 390
          C 211 390, 178 375, 164 350
          C 150 325, 145 295, 145 265
          L 145 225
          C 145 185, 182 150, 256 150
          C 330 150, 367 185, 367 225
          L 367 265
          C 367 295, 362 325, 348 350
          C 334 375, 301 390, 256 390 Z" fill="#ffd4a3" stroke="#1A1A1A" stroke-width="12" />

    <!-- Thick eyebrows -->
    <path d="M 190 240 Q 215 233, 235 240" fill="none" stroke="#2C1810" stroke-width="6"
        stroke-linecap="round" />
    <path d="M 277 240 Q 297 233, 322 240" fill="none" stroke="#2C1810" stroke-width="6"
        stroke-linecap="round" />

    <!-- Left eye (intense) -->
    <ellipse cx="211" cy="260" rx="10" ry="12" fill="#FFFFFF" />
    <circle cx="210" cy="260" r="9" fill="#2C1810" />
    <circle cx="212" cy="257" r="3" fill="#FFFFFF" />

    <!-- Right eye (intense) -->
    <ellipse cx="297" cy="260" rx="10" ry="12" fill="#FFFFFF" />
    <circle cx="296" cy="260" r="9" fill="#2C1810" />
    <circle cx="298" cy="257" r="3" fill="#FFFFFF" />

    <!-- Nose (broad, prominent) -->
    <path d="M 256 280 L 254 310 M 242 310 Q 256 317, 270 310" fill="none" stroke="#1A1A1A"
        stroke-width="8" stroke-linecap="round" />

    <!-- Mustache -->
    <path d="M 210 330 Q 230 338, 256 330 Q 282 338, 302 330" fill="#2C1810" />
    <path d="M 210 330 Q 230 325, 256 330 Q 282 325, 302 330" fill="none" stroke="#1A1A1A"
        stroke-width="3" />

    <!-- Goatee -->
    <ellipse cx="256" cy="365" rx="12" ry="12" fill="#2C1810" />

    <!-- Mouth (confident) -->
    <path d="M 220 340 Q 256 350, 292 340" fill="none" stroke="#1A1A1A" stroke-width="7"
        stroke-linecap="round" />
</svg>
